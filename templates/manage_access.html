<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Access</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <a href="{{ url_for('index') }}" class="back-btn">← Back to Home</a>
        
        <h1>🔑 Manage Access Control</h1>
        
        <form id="accessForm">
            <div class="form-group">
                <label>Action:</label>
                <select name="action" required>
                    <option value="grant">Grant Access</option>
                    <option value="revoke">Revoke Access</option>
                    <option value="check">Check Permission</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>User ID:</label>
                <input type="text" name="user_id" placeholder="e.g., RESEARCHER_001" required>
            </div>
            
            <div class="form-group">
                <label>Patient ID:</label>
                <input type="text" name="patient_id" placeholder="e.g., PATIENT_001" required>
            </div>
            
            <button type="submit">Execute Action</button>
        </form>
        
        <div id="result"></div>
        
        <div class="info-box" style="margin-top: 30px;">
            <h3>Available Patients:</h3>
            <p>PATIENT_001, PATIENT_002, PATIENT_003</p>
            <h3 style="margin-top: 15px;">Sample User IDs:</h3>
            <p>RESEARCHER_001, DOCTOR_001, NURSE_001</p>
        </div>
    </div>
    
    <script>
        document.getElementById('accessForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            const response = await fetch('/manage_access', {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            const resultDiv = document.getElementById('result');
            
            if (result.status === 'success') {
                if (result.has_access !== undefined) {
                    const access = result.has_access ? 'HAS ACCESS' : 'NO ACCESS';
                    resultDiv.innerHTML = `<div class="success"><strong>${access}</strong></div>`;
                } else {
                    resultDiv.innerHTML = `<div class="success">${result.message}</div>`;
                }
            } else {
                resultDiv.innerHTML = `<div class="error">Error: ${result.error}</div>`;
            }
        });
    </script>
</body>
</html>
